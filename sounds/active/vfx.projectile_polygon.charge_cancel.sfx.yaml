notes: |
  IT WAS DROPPED, and it must not be mistaken for the release. A shield-
  drop mistake and a fired shot are different events and a player has to
  hear which one happened. What separates them is MEASURED: this is 5.2dB
  quieter, it ends 200Hz lower, and it decays MONOTONICALLY -- the release
  does not, because the ball departing puts a bump back into its tail near
  the end. ⛔ It is NOT the fall SHAPE, which was the first claim here and
  was wrong: tracked in tenths, cancel front-loads 33% of its drop against
  the release’s 27%, so the two curves are near enough to identical that
  nobody could tell them apart by contour alone.
