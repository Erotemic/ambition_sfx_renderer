schema: ambition.sfxir.v1
id: boss.inugami.unsewn_sting
duration_ms: 2900
render:
  sample_rate: 48000
  channels: 2
  seed: 7261
  buffer_size: 128
  safety_profile: none
layers:
# The theremin of Wolfenstein's march as its `unleash` plays it (score
# galvanic_march, `theremin_unleash_climb`, 116 bpm): G3 for a beat, then a
# 240 ms glide up the octave to G4, held. A triangle with the theremin's
# vibrato (5.8 Hz, 38 cents, after 140 ms).
- name: theremin
  kind: synth_tone
  waveform: triangle
  frequency_hz:
    points: [[0.0, 196.0], [0.2, 196.0], [0.283, 392.0], [1.0, 392.0]]
    curve: exp
  vibrato:
    rate_hz: 5.8
    depth_cents: 38
    delay_ms: 140
  gain_db: -4
  start_ms: 0
  duration_ms: 2600
  envelope:
    attack_ms: 60
    hold_ms: 2140
    release_ms: 400
postprocess:
- effect: highpass
  cutoff_hz: 60
- effect: reverb
  room_size: 0.85
  damping: 0.5
  wet_level: 0.3
  dry_level: 1.0
- effect: fade_edges
  fade_in_ms: 0.5
  fade_out_ms: 200
- effect: normalize_peak
  target_db: -9.0
notes: 'The cue that something is wrong with his head (Jon, 2026-10-22: "I did like
  the theramin to cue the player into something being up with the head"): the
  theremin of his own march, described from its score, played when the seam round
  his neck pops. Iron Toccata comes in when the head tears off.'
