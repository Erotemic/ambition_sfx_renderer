schema: ambition.sfxir.v1
# Squishy click/filter technique reference: James Patrick / Slam Academy
# https://www.youtube.com/watch?v=RFzSPUJ_A3Q
# Adapted as one layer of game Foley; the final cue and implementation are original.
id: player.robot.slash.impact.flesh.deep
duration_ms: 430
render:
  sample_rate: 48000
  channels: 2
  # The seed of the approved "gore" candidate (2026-09-30).
  seed: 2202
  buffer_size: 128
  # The recipe does its own safety (highpass, soft saturation, lowpass at
  # 9 kHz, fade). The default tone-safety pass lowpasses at about 4.6-7 kHz
  # and removes the crack that makes this a hit.
  safety_profile: none
layers:
- name: gore_strike_heavy
  kind: noise_burst
  mode: flesh_strike
  weight: heavy
  duration_ms: 430
postprocess:
- effect: normalize_peak
  target_db: -5.0
notes: 'heavy player-robot blade hit on flesh: a broadband crack, a thump that falls from 170 to 62 Hz, and a midrange meat smack in the first milliseconds, then the wet tissue stems (blood, splatter, suction, pulp, muscle, bubbles) as a tail that decays over about 300 ms; the attributed click-filter technique remains supporting articulation inside the tissue stems'
