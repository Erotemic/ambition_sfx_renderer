schema: ambition.vfx_sfx_companions.v1
status: authoring_cross_domain_mapping_not_yet_runtime_contract
purpose: Stable content mapping between authored detached VFX sprites and authored procedural SFX companions.
integration_notes:
- Bind these IDs through generic presentation/content data; do not add engine switches on animation names.
- Loop entries name the cue with a .loop suffix and are intended to live only while the visual sustain is active.
- Loop recipes match the authored visual loop duration, but the current SFX renderer/packer does not guarantee sample-perfect
  seamless loop boundaries; integration may crossfade or retrigger until a dedicated loop-preparation contract exists.
- 'audibility is author intent: primary cues should normally sound, supporting cues may be suppressed when a stronger gameplay
  cue already owns the moment, and subtle cues should yield to ambience/music density.'
- Existing generic explosion SFX are listed separately and are not duplicated by this pack.
